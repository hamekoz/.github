name: Continuous Integration

on:
  workflow_call:
    inputs:
      runner:
        description: "El runner donde se ejecutará el trabajo (ej. ubuntu-latest o self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
      test_arguments:
        description: "Argumentos adicionales para el comando dotnet test. El default cubre el runner VSTest legacy (collector de cobertura XPlat). Los proyectos nuevos con Microsoft Testing Platform deben sobrescribirlo con las opciones --coverlet (ver hamekoz/.github docs/testing/dotnet.md)."
        required: false
        default: '--collect:"XPlat Code Coverage"'
        type: string
      format_command:
        description: "Comando de verificación de formato. El default ejecuta dotnet format --verify-no-changes completo. Los repositorios con código legacy y/o soluciones grandes pueden limitar la capa de analizadores a código nuevo con --include o ejecutar solo capas whitespace/style (ver hamekoz/.github docs/ci-cd/dotnet.md)."
        required: false
        default: "dotnet format --verify-no-changes"
        type: string

jobs:
  format-build-test:
    name: .NET format, build and test
    runs-on: ${{ inputs.runner }}
    env:
      Hamekoz_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: "global.json"
      - name: Verify code format
        run: ${{ inputs.format_command }}
      - name: Build with dotnet
        run: dotnet build --configuration Release
      - name: Test with dotnet
        # test_arguments usa el runner por defecto VSTest legacy: --collect:"XPlat Code Coverage".
        # Proyectos nuevos (MTP) sobrescriben el input con: --coverlet --coverlet-output-format cobertura --coverlet-output-format json
        run: dotnet test --no-build --configuration Release ${{ inputs.test_arguments }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: false # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
