name: Continuous Integration

on:
  workflow_call:
    inputs:
      runner:
        description: "El runner donde se ejecutará el trabajo (ej. ubuntu-latest o self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
      test_arguments:
        description: "Argumentos adicionales para el comando dotnet test (p.ej. parámetros de cobertura de código). Permite que cada repositorio que consume el workflow defina su propia configuración de cobertura."
        required: false
        default: '--collect:"XPlat Code Coverage"'
        type: string

jobs:
  format-build-test:
    name: .NET format, build and test
    runs-on: ${{ inputs.runner }}
    env:
      Hamekoz_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: "global.json"
      - name: Verify code format
        run: dotnet format --verify-no-changes
      - name: Build with dotnet
        run: dotnet build --configuration Release
      - name: Test with dotnet
        run: dotnet test --no-build --configuration Release ${{ inputs.test_arguments }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: false # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required
          verbose: true # optional (default = false)
