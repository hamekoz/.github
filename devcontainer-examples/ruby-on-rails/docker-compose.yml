services:
  app:
    image: mcr.microsoft.com/devcontainers/ruby:3.2
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgres://postgres:devpassword@postgres:5432/myapp_dev
      RAILS_ENV: development
    command: sleep infinity

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: myapp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
